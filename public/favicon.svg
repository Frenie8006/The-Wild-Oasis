<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A3D2A"/>
      <stop offset="100%" stop-color="#0D1A12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#B8902E"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B6642"/>
      <stop offset="100%" stop-color="#1E3F24"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E5234"/>
      <stop offset="100%" stop-color="#182E1C"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <!-- transparent background -->

  <!-- Gold circle rim -->
  <circle cx="16" cy="15" r="13" fill="none" stroke="url(#gold)" stroke-width="1.2"/>

  <!-- Back mountains -->
  <polygon points="7,22 12,9 17,22" fill="url(#mtn2)" opacity="0.8"/>
  <polygon points="15,22 21,7 27,22" fill="url(#mtn2)" opacity="0.8"/>

  <!-- Front mountain -->
  <polygon points="10,22 16,8 22,22" fill="url(#mtn1)"/>

  <!-- Snow caps -->
  <polygon points="16,8 13.5,14 18.5,14" fill="#E8E8DC" opacity="0.95"/>
  <polygon points="12,9 10,14 14,14" fill="#E8E8DC" opacity="0.7"/>
  <polygon points="21,7 18.5,13 23.5,13" fill="#E8E8DC" opacity="0.7"/>

  <!-- Cabin -->
  <rect x="13" y="18" width="6" height="4" fill="#8B6340"/>
  <polygon points="12,18 16,14 20,18" fill="#5C3D1E"/>
  <!-- Door -->
  <rect x="15" y="19.5" width="2" height="2.5" fill="#3A2510"/>
  <!-- Windows glow -->
  <rect x="13.2" y="18.5" width="1.5" height="1.2" fill="#C9A84C" opacity="0.9"/>
  <rect x="17.3" y="18.5" width="1.5" height="1.2" fill="#C9A84C" opacity="0.9"/>

  <!-- Trees -->
  <polygon points="8,22 9.5,16 11,22" fill="#2A5C30"/>
  <polygon points="21,22 22.5,16 24,22" fill="#2A5C30"/>
</svg>
