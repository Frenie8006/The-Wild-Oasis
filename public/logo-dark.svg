<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <!-- Background -->
    <rect id="bg" width="320" height="200" fill="#0D1A12"/>
    <!-- Gold gradient for emblem circle -->
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A3D2A"/>
      <stop offset="100%" stop-color="#162016"/>
    </radialGradient>
    <!-- Gold rim gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="40%" stop-color="#F0D080"/>
      <stop offset="70%" stop-color="#B8902E"/>
      <stop offset="100%" stop-color="#E8C96A"/>
    </linearGradient>
    <!-- Mountain fill -->
    <linearGradient id="mtnDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E5234"/>
      <stop offset="100%" stop-color="#1A3320"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B6642"/>
      <stop offset="100%" stop-color="#244D2C"/>
    </linearGradient>
    <!-- Cabin warm light -->
    <radialGradient id="warmGlow" cx="50%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <!-- Snow caps -->
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E8DC"/>
      <stop offset="100%" stop-color="#C8C8B8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <!-- transparent background -->

  <!-- ── EMBLEM CIRCLE ── -->
  <!-- Outer gold rim -->
  <circle cx="160" cy="82" r="66" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>
  <!-- Inner fill -->
  <circle cx="160" cy="82" r="63" fill="url(#circleGrad)"/>
  <!-- Warm glow overlay -->
  <circle cx="160" cy="82" r="63" fill="url(#warmGlow)"/>

  <!-- ── MOUNTAINS ── -->
  <!-- Back-left mountain -->
  <polygon points="108,112 136,50 164,112" fill="url(#mtnDark)" opacity="0.85"/>
  <!-- Snow cap back-left -->
  <polygon points="136,50 125,78 147,78" fill="url(#snow)" opacity="0.9"/>

  <!-- Back-right mountain -->
  <polygon points="152,112 182,44 212,112" fill="url(#mtnDark)" opacity="0.85"/>
  <!-- Snow cap back-right -->
  <polygon points="182,44 170,74 194,74" fill="url(#snow)" opacity="0.9"/>

  <!-- Front-centre mountain (larger) -->
  <polygon points="124,112 160,52 196,112" fill="url(#mtnMid)"/>
  <!-- Snow cap centre -->
  <polygon points="160,52 148,80 172,80" fill="url(#snow)"/>

  <!-- ── FOREGROUND GROUND ── -->
  <ellipse cx="160" cy="114" rx="56" ry="6" fill="#1E3A22" opacity="0.8"/>

  <!-- ── CABIN ── -->
  <!-- Cabin body -->
  <rect x="144" y="97" width="32" height="18" fill="#8B6340" rx="1"/>
  <!-- Cabin roof -->
  <polygon points="140,97 160,82 180,97" fill="#5C3D1E"/>
  <!-- Chimney -->
  <rect x="169" y="80" width="5" height="10" fill="#4A3018"/>
  <!-- Door -->
  <rect x="156" y="105" width="8" height="10" rx="1" fill="#4A3018"/>
  <!-- Windows -->
  <rect x="146" y="100" width="6" height="5" rx="0.5" fill="#C9A84C" opacity="0.9"/>
  <rect x="168" y="100" width="6" height="5" rx="0.5" fill="#C9A84C" opacity="0.9"/>
  <!-- Window cross bars -->
  <line x1="149" y1="100" x2="149" y2="105" stroke="#4A3018" stroke-width="0.7"/>
  <line x1="146" y1="102.5" x2="152" y2="102.5" stroke="#4A3018" stroke-width="0.7"/>
  <line x1="171" y1="100" x2="171" y2="105" stroke="#4A3018" stroke-width="0.7"/>
  <line x1="168" y1="102.5" x2="174" y2="102.5" stroke="#4A3018" stroke-width="0.7"/>

  <!-- ── TREES ── -->
  <!-- Left tree -->
  <polygon points="133,113 137,90 141,113" fill="#2A5C30"/>
  <polygon points="131,113 136,96 141,113" fill="#1E4A26"/>
  <rect x="135.5" y="110" width="3" height="5" fill="#5C3D1E"/>
  <!-- Right tree -->
  <polygon points="179,113 183,90 187,113" fill="#2A5C30"/>
  <polygon points="179,113 184,96 189,113" fill="#1E4A26"/>
  <rect x="181.5" y="110" width="3" height="5" fill="#5C3D1E"/>

  <!-- ── DECORATIVE LINES flanking circle ── -->
  <line x1="52" y1="82" x2="90" y2="82" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  <line x1="230" y1="82" x2="268" y2="82" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  <circle cx="52" cy="82" r="2" fill="#C9A84C" opacity="0.6"/>
  <circle cx="268" cy="82" r="2" fill="#C9A84C" opacity="0.6"/>

  <!-- ── WORDMARK ── -->
  <!-- "THE" small caps -->
  <text x="160" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="400" fill="#C9A84C" text-anchor="middle" letter-spacing="5" opacity="0.85">THE</text>
  <!-- "CABINS" main -->
  <text x="160" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#F0E8D0" text-anchor="middle" letter-spacing="6">CABINS</text>
  <!-- "MOTEL" -->
  <text x="160" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="400" fill="#C9A84C" text-anchor="middle" letter-spacing="7">MOTEL</text>

  <!-- Thin rule under emblem -->
  <line x1="100" y1="152" x2="220" y2="152" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
</svg>
